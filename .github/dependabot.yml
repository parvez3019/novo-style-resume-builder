version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # requirements-docs.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # MkDocs 2 is a breaking release, see #16
      - dependency-name: mkdocs
        versions: [">=2"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
